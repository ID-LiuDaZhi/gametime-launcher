<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>游戏时光 · 手机遥控</title>
<style>
:root{color-scheme:light;--green:#50763d;--ink:#303a29}*{box-sizing:border-box}body{margin:0;background:#f6eedf;color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Microsoft YaHei",sans-serif;padding:24px 20px calc(24px + env(safe-area-inset-bottom));max-width:620px;margin-inline:auto}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:29px;margin:0;font-family:serif}small{color:#6f745f}#status{font-size:13px;background:#e6dfcd;padding:7px 11px;border-radius:20px}#status.online{background:#dce8cd}.selected{margin:25px 0 18px;background:#fff9ec;border:2px solid #dbc9a7;border-bottom-width:7px;border-radius:23px;padding:24px;box-shadow:0 10px 20px #654d2510}h2{font-size:25px;margin:6px 0 0;word-break:break-word}button{font:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;border:2px solid #d1c09d;border-bottom-width:5px;background:#fff9ec;color:var(--ink);border-radius:18px;min-height:58px;padding:13px 15px}button:active{transform:translateY(2px);border-bottom-width:3px}button:disabled{opacity:.5;cursor:wait}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}.play{width:100%;background:var(--green);border-color:#36572b;color:white;font-size:22px;font-weight:700;min-height:73px}.game{width:100%;text-align:left;margin:6px 0;display:flex;justify-content:space-between;gap:8px}.game.active{border-color:var(--green);background:#e7eedc}h3{font-size:16px;margin:28px 0 9px}#message{min-height:30px;font-size:14px;margin-top:16px}footer{font-size:12px;color:#797a69;margin-top:28px}#instructions{display:none;background:#fff4d8;padding:18px;border-radius:16px;margin-top:20px}.pending{color:#8a6230}
</style>
<header><div><h1>游戏时光</h1><small>多人手机遥控 · 同一局域网</small></div><span id="status">正在连接</span></header>
<div id="instructions">请重新扫描电脑游戏大厅里的二维码，再用手机浏览器打开。</div>
<section class="selected"><small>电脑当前选中</small><h2 id="selected">等待游戏大厅…</h2></section>
<div class="row"><button data-action="previous">← 上一款</button><button data-action="next">下一款 →</button></div>
<button class="play" data-action="play">A　开始游戏</button>
<div class="row"><button data-action="back">B　返回大厅</button><button data-action="fullscreen" id="fullscreen">电脑全屏</button></div>
<div id="message" role="status" aria-live="polite"></div><h3>我的游戏</h3><div id="games"></div>
<footer>多部手机可扫描同一个二维码。所有手机共享电脑当前选择，操作按收到的顺序执行。在线数量按浏览器遥控页面统计。手机用于选游戏和启动，游戏内仍使用 Xbox 手柄或键鼠。</footer>
<script>
(()=>{'use strict';let key=new URLSearchParams(location.hash.slice(1)).get('code');if(key){sessionStorage.setItem('gametime-key',key);history.replaceState(null,'',location.pathname)}else key=sessionStorage.getItem('gametime-key');
let clientId=sessionStorage.getItem('gametime-client');if(!/^[0-9a-f]{32}$/.test(clientId||'')){clientId=Array.from(crypto.getRandomValues(new Uint8Array(16)),v=>v.toString(16).padStart(2,'0')).join('');sessionStorage.setItem('gametime-client',clientId)}
const $=id=>document.getElementById(id);let state=null,busy=false,pending=null,previousSignature='',polling=false;
function controls(){document.querySelectorAll('button').forEach(b=>b.disabled=!state||busy||!key)}
function connection(text,ok){$('status').textContent=text;$('status').className=ok?'online':''}
async function request(path,options={}){const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),4500);try{const res=await fetch(path,{...options,cache:'no-store',signal:controller.signal,headers:{'X-GameTime-Key':key,'X-GameTime-Client':clientId,...(options.headers||{})}});if(!res.ok){let error=new Error(await res.text());error.status=res.status;throw error}return await res.json()}finally{clearTimeout(timeout)}}
function render(s){state=s;connection('已连接 · '+(Number(s.connectedClients)||1)+' 个遥控端',true);$('selected').textContent=s.runningName? s.runningName+' · 游戏运行中':s.selectedName||'请选择游戏';$('fullscreen').textContent='电脑全屏';const signature=JSON.stringify([s.games,s.selectedId]);if(signature!==previousSignature){previousSignature=signature;$('games').replaceChildren();for(const game of s.games){const b=document.createElement('button');b.className='game'+(game.id===s.selectedId?' active':'');b.textContent=game.name+(game.id===s.selectedId?'　✓':'');b.onclick=()=>send('select',game.id);$('games').appendChild(b)}}const receipt=pending&&Array.isArray(s.receipts)?s.receipts.find(r=>r.id===pending.id):null;if(receipt){$('message').textContent=receipt.message;pending=null;busy=false}controls()}
async function poll(){if(!key||polling)return;polling=true;try{render(await request('/api/state'));$('instructions').style.display='none'}catch(e){state=null;connection(e.status===403?'需要重新扫码':'连接已断开',false);$('message').textContent=e.status===403?'二维码已更新，请重新扫描。':'请确认电脑大厅已打开、手机与电脑在同一局域网。';if(e.status===403)$('instructions').style.display='block';controls()}finally{if(pending&&Date.now()-pending.time>6500){$('message').textContent='电脑尚未确认操作，请检查大厅后重试。';pending=null;busy=false;controls()}polling=false}}
async function send(action,gameId){if(busy||!state)return;busy=true;controls();$('message').textContent='正在通知电脑…';try{let data=await request('/api/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,gameId})});pending={id:data.requestId,time:Date.now()};await poll()}catch(e){$('message').textContent=e.message||'没有发送成功，请重试';busy=false;controls()}}
document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>send(b.dataset.action));controls();if(!key){connection('请扫码连接',false);$('instructions').style.display='block'}else{poll();setInterval(poll,900)}document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});})();
</script></html>
